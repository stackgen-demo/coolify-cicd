name: Security gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: mkdir -p evidence
      - name: Detect hard-coded secrets
        run: >-
          docker run --rm --volume "${PWD}:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --no-git --redact --report-format json
          --report-path /repo/evidence/gitleaks.json --exit-code 1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-evidence
          path: evidence/gitleaks.json
          if-no-files-found: warn

  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: mkdir -p evidence
      - name: Run pinned SAST rules
        run: >-
          docker run --rm --volume "${PWD}:/src"
          semgrep/semgrep@sha256:207983631beecdbe7fa29196c7f4a7a5f29033933cdb76c687ce4a672e07618d
          semgrep scan --config /src/policies/semgrep.yml --error --json
          --output /src/evidence/semgrep.json /src/app/src
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-evidence
          path: evidence/semgrep.json
          if-no-files-found: warn

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: mkdir -p evidence
      - name: Scan dependencies, filesystem, secrets and IaC
        run: >-
          docker run --rm --volume "${PWD}:/repo"
          aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --exit-code 1 --format json --output /repo/evidence/trivy.json /repo
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-evidence
          path: evidence/trivy.json
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm run typecheck --prefix app
      - run: npm test --prefix app
      - run: npm run build --prefix app
      - run: npm audit --prefix app --omit=dev --audit-level=high

  policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test deterministic OPA policies
        run: >-
          docker run --rm --volume "${PWD}:/workspace" --workdir /workspace
          openpolicyagent/opa@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da
          test policies --verbose

  security-gate:
    if: always()
    needs: [gitleaks, semgrep, trivy, tests, policies]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: evidence
          merge-multiple: true
      - name: Evaluate aggregate gate
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          POLICIES_RESULT: ${{ needs.policies.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: node scripts/security/evaluate-gate.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-gate-evidence
          path: evidence/security-gate.json
          if-no-files-found: error

  aiden-review:
    if: always()
    needs: [security-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Aiden to correlate completed evidence
        env:
          AIDEN_WEBHOOK_URL: ${{ secrets.AIDEN_PR_REVIEW_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${AIDEN_WEBHOOK_URL}"
          payload="$(jq -cn \
            --arg repository_full_name "${REPOSITORY}" \
            --argjson pull_request_number "${PR_NUMBER}" \
            --argjson workflow_run_id "${GITHUB_RUN_ID}" \
            --arg commit_sha "${COMMIT_SHA}" \
            '{repository_full_name:$repository_full_name,pull_request_number:$pull_request_number,workflow_run_id:$workflow_run_id,commit_sha:$commit_sha}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --header 'content-type: application/json' --data "${payload}" "${AIDEN_WEBHOOK_URL}" >/dev/null
