name: Reset Talkdesk demo

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: talkdesk-demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    environment: demo-reset
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Discover previous demo context
        id: context
        run: |
          set -euo pipefail
          base_branch="${GITHUB_REF_NAME}"
          controls="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base "${base_branch}" --state merged --limit 100 \
            --json number,headRefName,mergeCommit,mergedAt \
            --jq '[.[] | select(.headRefName | startswith("security-controls/"))] | sort_by(.mergedAt) | last')"
          test -n "${controls}" && test "${controls}" != "null"

          controls_pr="$(jq -r '.number' <<<"${controls}")"
          controls_branch="$(jq -r '.headRefName' <<<"${controls}")"
          controls_merge_sha="$(jq -r '.mergeCommit.oid' <<<"${controls}")"
          [[ "${controls_branch}" =~ ^security-controls/[0-9]+-[a-zA-Z0-9._-]+$ ]]
          application_pr="${controls_branch#security-controls/}"
          application_pr="${application_pr%%-*}"
          git cat-file -e "${controls_merge_sha}^{commit}"

          application="$(gh pr view "${application_pr}" --repo "${GITHUB_REPOSITORY}" --json state,mergeCommit)"
          application_merge_sha="$(jq -r '.mergeCommit.oid // ""' <<<"${application}")"

          last_context="$(gh variable get DEMO_LAST_RUN_CONTEXT --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true)"
          if jq -e . >/dev/null 2>&1 <<<"${last_context}"; then
            completed_run_id="$(jq -r '.github_run_id // ""' <<<"${last_context}")"
            deployment_uuid="$(jq -r '.deployment_uuid // ""' <<<"${last_context}")"
            image_digest="$(jq -r '.image_digest // ""' <<<"${last_context}")"
            report_location="$(jq -r '.report_location // ""' <<<"${last_context}")"
          else
            latest_deploy="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-demo.yml --limit 100 \
              --json databaseId,status,conclusion,createdAt,url \
              --jq '[.[] | select(.status == "completed" and .conclusion != "skipped")] | sort_by(.createdAt) | last')"
            completed_run_id="$(jq -r '.databaseId // "not-recorded"' <<<"${latest_deploy}")"
            deployment_uuid="not-recorded"
            image_digest="$(gh variable get DEMO_IMAGE_DIGEST --repo "${GITHUB_REPOSITORY}")"
            deploy_url="$(jq -r '.url // ""' <<<"${latest_deploy}")"
            report_location="${deploy_url:+${deploy_url}#artifacts}"
          fi
          image_digest="${image_digest:-$(gh variable get DEMO_IMAGE_DIGEST --repo "${GITHUB_REPOSITORY}")}"
          completed_run_id="${completed_run_id:-not-recorded}"
          deployment_uuid="${deployment_uuid:-not-recorded}"
          report_location="${report_location:-not-recorded}"

          {
            echo "application_pr=${application_pr}"
            echo "application_merge_sha=${application_merge_sha}"
            echo "controls_pr=${controls_pr}"
            echo "controls_branch=${controls_branch}"
            echo "controls_merge_sha=${controls_merge_sha}"
            echo "completed_run_id=${completed_run_id}"
            echo "deployment_uuid=${deployment_uuid}"
            echo "image_digest=${image_digest}"
            echo "report_location=${report_location}"
          } >> "${GITHUB_OUTPUT}"

      - name: Pause demo automations
        run: gh variable set DEMO_STATE --body resetting --repo "${GITHUB_REPOSITORY}"

      - name: Remove dedicated demo security ruleset
        env:
          RULESET_ID: ${{ vars.DEMO_SECURITY_RULESET_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${RULESET_ID}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"
          fi

      - name: Create audited reset branch
        id: branch
        env:
          APPLICATION_MERGE_SHA: ${{ steps.context.outputs.application_merge_sha }}
          CONTROLS_MERGE_SHA: ${{ steps.context.outputs.controls_merge_sha }}
        run: |
          set -euo pipefail
          reset_branch="demo-reset/${GITHUB_RUN_ID}"
          git config user.name "talkdesk-demo-reset[bot]"
          git config user.email "talkdesk-demo-reset[bot]@users.noreply.github.com"
          git switch -c "${reset_branch}"
          revert_recorded_change() {
            local commit_sha="$1"
            local parent_count
            parent_count="$(git rev-list --parents -n 1 "${commit_sha}" | awk '{print NF - 1}')"
            if (( parent_count > 1 )); then
              git revert --no-edit -m 1 "${commit_sha}"
            else
              git revert --no-edit "${commit_sha}"
            fi
          }
          if [[ -n "${APPLICATION_MERGE_SHA}" ]]; then
            revert_recorded_change "${APPLICATION_MERGE_SHA}"
          fi
          revert_recorded_change "${CONTROLS_MERGE_SHA}"
          node scripts/reset/verify-baseline.mjs
          git push origin "${reset_branch}"
          echo "name=${reset_branch}" >> "${GITHUB_OUTPUT}"

      - name: Open and merge reset PR
        env:
          RESET_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh label create demo-reset --color B60205 --description "Operator-approved demo reset" \
            --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          body="$(jq -n \
            --arg completed_run_id '${{ steps.context.outputs.completed_run_id }}' \
            --arg application_pr '${{ steps.context.outputs.application_pr }}' \
            --arg controls_pr '${{ steps.context.outputs.controls_pr }}' \
            --arg application_merge_sha '${{ steps.context.outputs.application_merge_sha }}' \
            --arg controls_merge_sha '${{ steps.context.outputs.controls_merge_sha }}' \
            --arg deployment_uuid '${{ steps.context.outputs.deployment_uuid }}' \
            --arg image_digest '${{ steps.context.outputs.image_digest }}' \
            --arg report_location '${{ steps.context.outputs.report_location }}' \
            '{completed_run_id:$completed_run_id,application_pr:$application_pr,controls_pr:$controls_pr,application_merge_sha:$application_merge_sha,controls_merge_sha:$controls_merge_sha,deployment_uuid:$deployment_uuid,image_digest:$image_digest,report_location:$report_location}')"
          reset_pr="$(gh pr create --base "${GITHUB_REF_NAME}" --head "${RESET_BRANCH}" \
            --title "Reset Talkdesk demo after run ${GITHUB_RUN_ID}" \
            --label demo-reset \
            --body "Operator-approved reset. No runtime deployment.\n\n\`\`\`json\n${body}\n\`\`\`")"
          # Keep the reset PR branch as part of the demo's audit history.
          gh pr merge "${reset_pr}" --merge

      - name: Preserve historic demo PRs and branches
        env:
          APPLICATION_PR: ${{ steps.context.outputs.application_pr }}
          CONTROLS_BRANCH: ${{ steps.context.outputs.controls_branch }}
          CONTROLS_PR: ${{ steps.context.outputs.controls_pr }}
        run: |
          set -euo pipefail
          {
            echo "## Historical demo evidence retained"
            echo
            echo "Application PR #${APPLICATION_PR}, security-controls PR #${CONTROLS_PR}, and branch \\`${CONTROLS_BRANCH}\\` were retained."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create closed replay PR
        id: replay
        run: |
          set -euo pipefail
          base_branch="${GITHUB_REF_NAME}"
          replay_branch="demo-replay/${GITHUB_RUN_ID}"
          git fetch origin "${base_branch}"
          git switch -C "${replay_branch}" "origin/${base_branch}"
          git config user.name "talkdesk-demo-reset[bot]"
          git config user.email "talkdesk-demo-reset[bot]@users.noreply.github.com"
          mkdir -p demo
          printf '%s\\n' \
            '# Demo replay marker' \
            '' \
            'This harmless change exists only to provide a repeatable application PR for the next demo run.' \
            "Reset workflow run: ${GITHUB_RUN_ID}" \
            > demo/replay-marker.md
          git add demo/replay-marker.md
          git commit -m "Create reusable demo replay PR"
          git push origin "${replay_branch}"

          gh label create demo-application --color 1D76DB \
            --description "Application PR used to start the security demo" \
            --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          replay_url="$(gh pr create --base "${base_branch}" --head "${replay_branch}" \
            --title "Replay Talkdesk security demo" \
            --label demo-application \
            --body "This PR is deliberately closed after reset. Reopen it to start a fresh security-controls bootstrap run. The only change is a harmless replay marker, which the next reset will revert.")"
          replay_pr="$(gh pr view "${replay_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)"
          gh pr close "${replay_pr}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Reset complete. Reopen this PR to trigger the next demo run."
          echo "number=${replay_pr}" >> "${GITHUB_OUTPUT}"
          echo "url=${replay_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Next demo trigger"
            echo
            echo "Reopen [replay application PR #${replay_pr}](${replay_url}) to start the next demo. Its branch is intentionally retained."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore ready state
        if: success()
        run: |
          new_run_id="$(cat /proc/sys/kernel/random/uuid)"
          gh variable set DEMO_RUN_ID --body "${new_run_id}" --repo "${GITHUB_REPOSITORY}"
          gh variable set DEMO_STATE --body ready --repo "${GITHUB_REPOSITORY}"
