name: Publish immutable demo artifact

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional human-readable tag in addition to the immutable digest
        required: false
        default: demo
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: talkdesk-demo-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      image_reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the reviewed application image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}

      - name: Record immutable image reference
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          reference="ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "### Immutable demo artifact" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${reference}\`" >> "${GITHUB_STEP_SUMMARY}"
